<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck Selection</title>
    <link rel="stylesheet" href="deck-styles.css">
</head>
<body>
    <div class="container">
        <h1>Deck Selection</h1>
        <form id="deck-selection-form">
            <label for="deck-size">Deck Size (10-100):</label>
            <input type="number" id="deck-size" name="deck-size" min="10" max="100" required>
            
            <label for="vigor-type">Vigor Type:</label>
            <select id="vigor-type" name="vigor-type" required>
                <option value="Earth">Earth</option>
                <option value="Fairy">Fairy</option>
                <option value="Fungus">Fungus</option>
                <option value="Greed">Greed</option>
                <option value="Lava">Lava</option>
                <option value="Lightning">Lightning</option>
                <option value="Moon">Moon</option>
                <option value="Ocean">Ocean</option>
                <option value="Sorcery">Sorcery</option>
                <option value="Spirit">Spirit</option>
                <option value="Sun">Sun</option>
                <option value="Tar">Tar</option>
            </select>

            <button type="submit">Submit</button>
        </form>
    </div>
    <script src="deck-script.js"></script>
</body>
</html>
